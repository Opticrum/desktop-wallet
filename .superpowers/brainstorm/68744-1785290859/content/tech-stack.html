<h2>技术栈怎么选？</h2>
<p class="subtitle">纯静态 mockup，放在 <code>mockup/</code> 下。请点选一个方案。</p>

<div class="options">
  <div class="option" data-choice="react" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Vite + React + TypeScript</h3>
      <p>组件化、主题切换方便，后续易演进成 Electron / Tauri 桌面端。推荐。</p>
    </div>
  </div>
  <div class="option" data-choice="vue" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Vite + Vue 3</h3>
      <p>与 rust-server web-console 技术栈一致，团队熟悉度高。</p>
    </div>
  </div>
  <div class="option" data-choice="vanilla" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>纯 HTML / CSS / JS</h3>
      <p>零构建、打开即看。多页面与主题切换会手写更多胶水代码。</p>
    </div>
  </div>
</div>
