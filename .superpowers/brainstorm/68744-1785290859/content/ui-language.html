<h2>界面文案用哪种语言？</h2>
<p class="subtitle">Mock 数据、导航、按钮文案都会按这个写。后续可再做 i18n。</p>

<div class="options">
  <div class="option" data-choice="zh" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>中文（推荐）</h3>
      <p>与你目前的沟通语言一致，适合国内演示与评审。</p>
    </div>
  </div>
  <div class="option" data-choice="en" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>英文</h3>
      <p>更贴近国际加密钱包产品习惯，便于对外分享。</p>
    </div>
  </div>
  <div class="option" data-choice="bilingual" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>中英双语可切换</h3>
      <p>顶栏加语言切换。mockup 工作量约翻倍，适合演示国际化。</p>
    </div>
  </div>
</div>
