[package]
name = "opticrum-desktop"
version = "0.1.0"
description = "Opticrum Desktop — local-first Fiber wallet (Tauri shell)"
authors = ["ashuralyk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opticrum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time"] }
opticrum-wallet-core = { path = "../core" }
